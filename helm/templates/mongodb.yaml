{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.mongodb.auth.rootUser | quote }}
  root-password: {{ .Values.mongodb.auth.rootPassword | quote }}
  replica-set-key: "c2VjcmV0LWtleWZpbGUtZm9yLW1vbmdvZHItc2hhcmRlZC04LjAuOQo="
---
# ==============================================================================
# 1. MONGOS QUERY ROUTER SERVICE (Main Entrypoint for Applications on Port 27017)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb-mongos
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mongos
      port: 27017
      targetPort: 27017
  selector:
    app: mongodb-mongos
---
# ==============================================================================
# 2. CONFIG SERVER HEADLESS SERVICE & STATEFULSET (CSRS)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-configsvr-headless
  labels:
    app: mongodb-configsvr
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: configsvr
      port: 27019
  selector:
    app: mongodb-configsvr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-configsvr
  labels:
    app: mongodb-configsvr
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  serviceName: mongodb-configsvr-headless
  replicas: {{ .Values.mongodb.configsvr.replicas }}
  selector:
    matchLabels:
      app: mongodb-configsvr
  template:
    metadata:
      labels:
        app: mongodb-configsvr
    spec:
      initContainers:
        - name: setup-keyfile
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /tmp/secrets/replica-set-key /data/keyfile/key.txt
              chmod 400 /data/keyfile/key.txt
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/secrets
            - name: keyfile-perm
              mountPath: /data/keyfile
      containers:
        - name: configsvr
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/bash
            - -ce
            - |
              mongod \
                --configsvr \
                --replSet {{ .Values.mongodb.configsvr.replicaSetName }} \
                --port 27019 \
                --bind_ip_all \
                --dbpath /data/db \
                --keyFile /data/keyfile/key.txt
          ports:
            - name: configsvr
              containerPort: 27019
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-perm
              mountPath: /data/keyfile
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-auth
            defaultMode: 0400
        - name: keyfile-perm
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.mongodb.configsvr.persistence.size }}
---
# ==============================================================================
