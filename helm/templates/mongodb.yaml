{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.mongodb.auth.rootUser | quote }}
  root-password: {{ .Values.mongodb.auth.rootPassword | quote }}
  app-user: {{ .Values.mongodb.auth.appUser | default "mongo_app" | quote }}
  app-password: {{ .Values.mongodb.auth.appPassword | default "mongoAppPassword123" | quote }}
  replica-set-key: "c2VjcmV0LWtleWZpbGUtZm9yLW1vbmdvZHItcmVwbGljYXNldC04LjAuOQo="
---
# ==============================================================================
# 1. MONGODB CLIENT SERVICE (Port 27017 Client Entrypoint)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.port | default 27017 }}
      targetPort: 27017
  selector:
    app: mongodb
---
# ==============================================================================
# 2. MONGODB HEADLESS SERVICE (Internal Peer Discovery for ReplicaSet rs0)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.port | default 27017 }}
  selector:
    app: mongodb
---
# ==============================================================================
# 3. MONGODB 3-MEMBER REPLICASET STATEFULSET (1 Primary + 2 Secondaries)
# Distributed across 3 physical hosts with podAntiAffinity
# ==============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  serviceName: mongodb-headless
  replicas: {{ .Values.mongodb.replicas | default 3 }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mongodb
                topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: setup-keyfile
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /tmp/secrets/replica-set-key /data/keyfile/key.txt
              chmod 400 /data/keyfile/key.txt
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/secrets
            - name: keyfile-perm
              mountPath: /data/keyfile
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/bash
            - -ce
            - |
              exec mongod \
                --replSet {{ .Values.mongodb.replicaSetName | default "rs0" }} \
                --port 27017 \
                --bind_ip_all \
                --dbpath /data/db \
                --keyFile /data/keyfile/key.txt
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-perm
              mountPath: /data/keyfile
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-auth
            defaultMode: 0400
        - name: keyfile-perm
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.mongodb.persistence.storageClass | default .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
---
# ==============================================================================
# 4. MONGODB REPLICASET AUTOMATIC INITIALIZATION HOOK (rs.initiate)
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replicaset-init
  labels:
    app: mongodb-init
    {{- include "cloudcluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 15
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-replicaset
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for mongodb-0 to become responsive..."
              until mongosh --host mongodb-0.mongodb-headless --port 27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
                sleep 2
              done

              echo "Checking or initiating MongoDB ReplicaSet ({{ .Values.mongodb.replicaSetName | default "rs0" }})..."
              mongosh --host mongodb-0.mongodb-headless --port 27017 --eval "
                try {
                  const status = rs.status();
                  print('ReplicaSet already initialized. Current state: ' + status.ok);
                } catch (err) {
                  print('Initiating ReplicaSet {{ .Values.mongodb.replicaSetName | default "rs0" }} across 3 physical nodes...');
                  rs.initiate({
                    _id: '{{ .Values.mongodb.replicaSetName | default "rs0" }}',
                    members: [
                      { _id: 0, host: 'mongodb-0.mongodb-headless:27017', priority: 2 },
                      { _id: 1, host: 'mongodb-1.mongodb-headless:27017', priority: 1 },
                      { _id: 2, host: 'mongodb-2.mongodb-headless:27017', priority: 1 }
                    ]
                  });
                  print('ReplicaSet initiated successfully!');
                }
              "

              sleep 6
              echo "Creating MongoDB Root Administrator Account in admin database..."
              mongosh --host mongodb-0.mongodb-headless --port 27017 --eval "
                try {
                  // 1. Root Cluster Administrator in admin database
                  db.getSiblingDB('admin').createUser({
                    user: '{{ .Values.mongodb.auth.rootUser }}',
                    pwd: '{{ .Values.mongodb.auth.rootPassword }}',
                    roles: [ { role: 'root', db: 'admin' } ]
                  });
                  print('Admin root user created successfully.');

                  // 2. Direct Application User in target business database (appdb)
                  // Standard MongoDB drivers (Spring Boot, PyMongo, Mongoose) connecting to /appdb 
                  // authenticate directly on appdb WITHOUT needing authSource=admin or --authenticationDatabase!
                  db.getSiblingDB('appdb').createUser({
                    user: '{{ .Values.mongodb.auth.appUser | default "mongo_app" }}',
                    pwd: '{{ .Values.mongodb.auth.appPassword | default "mongoAppPassword123" }}',
                    roles: [ { role: 'readWrite', db: 'appdb' }, { role: 'dbAdmin', db: 'appdb' } ]
                  });
                  print('Application user ({{ .Values.mongodb.auth.appUser | default "mongo_app" }}) created directly on appdb.');

                  // 3. Universal Multi-Database User in admin database
                  // Allows other applications/microservices to access any database using ?authSource=admin
                  db.getSiblingDB('admin').createUser({
                    user: '{{ .Values.mongodb.auth.appUser | default "mongo_app" }}',
                    pwd: '{{ .Values.mongodb.auth.appPassword | default "mongoAppPassword123" }}',
                    roles: [ { role: 'readWriteAnyDatabase', db: 'admin' }, { role: 'clusterMonitor', db: 'admin' } ]
                  });
                  print('Universal application user ({{ .Values.mongodb.auth.appUser | default "mongo_app" }}) created in admin for multi-database access.');
                } catch(e) {
                  print('User already exists or warning: ' + e.message);
                }
              " || true

              echo "------------------------------------------------------------"
              echo "✅ MongoDB 3-Member ReplicaSet (rs0) initialized successfully!"
              echo "Connection URI: mongodb://admin:*****@mongodb-0.mongodb-headless:27017,mongodb-1.mongodb-headless:27017,mongodb-2.mongodb-headless:27017/?replicaSet=rs0&authSource=admin"
              echo "------------------------------------------------------------"
{{- end }}
