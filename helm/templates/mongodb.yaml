# ==============================================================================
# 5. MONGOS QUERY ROUTER DEPLOYMENT (Stateless, Connected to CSRS)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-mongos
  labels:
    app: mongodb-mongos
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mongodb.mongos.replicas }}
  selector:
    matchLabels:
      app: mongodb-mongos
  template:
    metadata:
      labels:
        app: mongodb-mongos
    spec:
      initContainers:
        - name: setup-keyfile
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /tmp/secrets/replica-set-key /data/keyfile/key.txt
              chmod 400 /data/keyfile/key.txt
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/secrets
            - name: keyfile-perm
              mountPath: /data/keyfile
      containers:
        - name: mongos
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/bash
            - -ce
            - |
              mongos \
                --configdb configReplSet/mongodb-configsvr-0.mongodb-configsvr-headless:27019,mongodb-configsvr-1.mongodb-configsvr-headless:27019,mongodb-configsvr-2.mongodb-configsvr-headless:27019 \
                --port 27017 \
                --bind_ip_all \
                --keyFile /data/keyfile/key.txt
          ports:
            - name: mongos
              containerPort: 27017
          volumeMounts:
            - name: keyfile-perm
              mountPath: /data/keyfile
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-auth
            defaultMode: 0400
        - name: keyfile-perm
          emptyDir: {}
---
# ==============================================================================
# 6. SHARDED CLUSTER INITIALIZATION HOOK (CSRS + Shards Registration)
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-sharded-init
  labels:
    app: mongodb-sharded-init
    {{- include "cloudcluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 15
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-sharded-cluster
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for configsvr to be ready..."
              until mongosh --host mongodb-configsvr-0.mongodb-configsvr-headless --port 27019 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
                sleep 2
              done

              echo "Initiating Config Server ReplicaSet (CSRS)..."
              mongosh --host mongodb-configsvr-0.mongodb-configsvr-headless --port 27019 --eval "
                try {
                  rs.initiate({
                    _id: 'configReplSet',
                    configsvr: true,
                    members: [
                      { _id: 0, host: 'mongodb-configsvr-0.mongodb-configsvr-headless:27019' },
                      { _id: 1, host: 'mongodb-configsvr-1.mongodb-configsvr-headless:27019' },
                      { _id: 2, host: 'mongodb-configsvr-2.mongodb-configsvr-headless:27019' }
                    ]
                  });
                } catch(e) { print(e); }
              " || true

              echo "Initiating Shard 0 ReplicaSet..."
              mongosh --host mongodb-shard0-0.mongodb-shard0-headless --port 27018 --eval "
                try {
                  rs.initiate({
                    _id: 'shard0rs',
                    members: [
                      { _id: 0, host: 'mongodb-shard0-0.mongodb-shard0-headless:27018' },
                      { _id: 1, host: 'mongodb-shard0-1.mongodb-shard0-headless:27018' },
                      { _id: 2, host: 'mongodb-shard0-2.mongodb-shard0-headless:27018' }
                    ]
                  });
                } catch(e) { print(e); }
              " || true

              echo "Initiating Shard 1 ReplicaSet..."
              mongosh --host mongodb-shard1-0.mongodb-shard1-headless --port 27018 --eval "
                try {
                  rs.initiate({
                    _id: 'shard1rs',
                    members: [
                      { _id: 0, host: 'mongodb-shard1-0.mongodb-shard1-headless:27018' },
                      { _id: 1, host: 'mongodb-shard1-1.mongodb-shard1-headless:27018' },
                      { _id: 2, host: 'mongodb-shard1-2.mongodb-shard1-headless:27018' }
                    ]
                  });
                } catch(e) { print(e); }
              " || true

              sleep 5
              echo "Waiting for mongos router to be online..."
              until mongosh --host mongodb --port 27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
                sleep 2
              done

              echo "Registering Shard 0 & Shard 1 into Mongos Router..."
              mongosh --host mongodb --port 27017 --eval "
                sh.addShard('shard0rs/mongodb-shard0-0.mongodb-shard0-headless:27018,mongodb-shard0-1.mongodb-shard0-headless:27018,mongodb-shard0-2.mongodb-shard0-headless:27018');
                sh.addShard('shard1rs/mongodb-shard1-0.mongodb-shard1-headless:27018,mongodb-shard1-1.mongodb-shard1-headless:27018,mongodb-shard1-2.mongodb-shard1-headless:27018');
                sh.status();
              "
              echo "MongoDB Sharded Cluster fully initialized!"
{{- end }}
