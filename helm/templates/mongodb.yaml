{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.mongodb.auth.rootUser | quote }}
  root-password: {{ .Values.mongodb.auth.rootPassword | quote }}
  replica-set-key: "c2VjcmV0LWtleWZpbGUtZm9yLW1vbmdvZHItY2x1c3Rlci04LjAuOQo="
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.port }}
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.port }}
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  serviceName: mongodb-headless
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      initContainers:
        - name: setup-keyfile
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /tmp/secrets/replica-set-key /data/keyfile/key.txt
              chmod 400 /data/keyfile/key.txt
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/secrets
            - name: keyfile-perm
              mountPath: /data/keyfile
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/bash
            - -ce
            - |
              mongod \
                --bind_ip_all \
                --replSet {{ .Values.mongodb.replicaSetName }} \
                --dbpath /data/db \
                --keyFile /data/keyfile/key.txt
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-perm
              mountPath: /data/keyfile
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-auth
            defaultMode: 0400
        - name: keyfile-perm
          emptyDir: {}
  {{- if .Values.mongodb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
  {{- end }}
---
# MongoDB 3-Member Replica Set Initializer Job
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-replicaset
  labels:
    app: mongodb-init
    {{- include "cloudcluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-rs
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for mongodb-0 to accept connections..."
              until mongosh --host mongodb-0.mongodb-headless --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
                sleep 3
              done

              echo "Checking replica set status on mongodb-0..."
              STATUS=$(mongosh --host mongodb-0.mongodb-headless --quiet --eval "rs.status().ok" 2>/dev/null || echo "0")
              
              if [ "$STATUS" != "1" ]; then
                echo "Initiating 3-member Replica Set {{ .Values.mongodb.replicaSetName }}..."
                MEMBERS_JS=""
                {{- range $i, $e := until (int .Values.mongodb.replicas) }}
                {{- if $i }},{{- end }}
                MEMBERS_JS="${MEMBERS_JS}{ _id: {{ $i }}, host: 'mongodb-{{ $i }}.mongodb-headless.{{ $.Release.Namespace }}.svc.cluster.local:27017' }"
                {{- end }}

                mongosh --host mongodb-0.mongodb-headless --eval "
                  rs.initiate({
                    _id: '{{ .Values.mongodb.replicaSetName }}',
                    members: [ ${MEMBERS_JS} ]
                  });
                "
                sleep 5
                echo "Creating root administrator..."
                mongosh --host mongodb-0.mongodb-headless --eval "
                  db.getSiblingDB('admin').createUser({
                    user: '{{ .Values.mongodb.auth.rootUser }}',
                    pwd: '{{ .Values.mongodb.auth.rootPassword }}',
                    roles: [ { role: 'root', db: 'admin' } ]
                  });
                "
                echo "MongoDB Replica Set initialized with 3 members."
              else
                echo "Replica set already initialized."
              fi
{{- end }}
