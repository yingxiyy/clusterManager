{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  labels:
    app: mysql
    {{- include "cloudcluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ .Values.mysql.rootPassword | quote }}
  replication-user: {{ .Values.mysql.replicationUser | quote }}
  replication-password: {{ .Values.mysql.replicationPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  labels:
    app: mysql
    {{- include "cloudcluster.labels" . | nindent 4 }}
data:
  my.cnf: |
    [mysqld]
    default_authentication_plugin=mysql_native_password
    gtid_mode=ON
    enforce_gtid_consistency=ON
    log_bin=mysql-bin
    binlog_format=ROW
    binlog_row_image=FULL
    relay_log=mysql-relay-bin
    read_only=OFF
    max_connections=500
    innodb_buffer_pool_size=1G
    innodb_log_file_size=256M
    innodb_flush_log_at_trx_commit=1
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: {{ .Values.mysql.port }}
      targetPort: 3306
  selector:
    app: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  labels:
    app: mysql
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: {{ .Values.mysql.port }}
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
    {{- include "cloudcluster.labels" . | nindent 4 }}
spec:
  serviceName: mysql-headless
  replicas: {{ .Values.mysql.replicas }}
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        # Determine server-id based on pod ordinal (e.g. mysql-0 -> 100, mysql-1 -> 101)
        - name: init-mysql-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL=$(echo ${HOSTNAME} | rev | cut -d'-' -f1 | rev)
              SERVER_ID=$((100 + ORDINAL))
              echo "[mysqld]" > /mnt/conf.d/server-id.cnf
              echo "server-id=${SERVER_ID}" >> /mnt/conf.d/server-id.cnf
              if [ "$ORDINAL" != "0" ]; then
                echo "read_only=ON" >> /mnt/conf.d/server-id.cnf
                echo "super_read_only=ON" >> /mnt/conf.d/server-id.cnf
              fi
              echo "Generated server-id.cnf with server-id=${SERVER_ID}"
          volumeMounts:
            - name: conf-d
              mountPath: /mnt/conf.d
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: mysql-config-vol
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
            - name: conf-d
              mountPath: /etc/mysql/conf.d/server-id.cnf
              subPath: server-id.cnf
      volumes:
        - name: mysql-config-vol
          configMap:
            name: mysql-config
        - name: conf-d
          emptyDir: {}
  {{- if .Values.mysql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
  {{- end }}
---
# MySQL 3-Member Replication Initializer Job
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-replication
  labels:
    app: mysql-init
    {{- include "cloudcluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure-replication
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
            - name: REPL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: replication-user
            - name: REPL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: replication-password
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for mysql-0 (Primary) to be ready..."
              until mysql -h mysql-0.mysql-headless -u root -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" > /dev/null 2>&1; do
                sleep 3
              done

              echo "Configuring replication user on mysql-0..."
              mysql -h mysql-0.mysql-headless -u root -p"${MYSQL_ROOT_PASSWORD}" <<EOF
              CREATE USER IF NOT EXISTS '${REPL_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${REPL_PASSWORD}';
              GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO '${REPL_USER}'@'%';
              FLUSH PRIVILEGES;
              EOF

              {{- range $i, $e := until (int .Values.mysql.replicas) }}
              {{- if gt $i 0 }}
              echo "Connecting replica mysql-{{ $i }} to primary mysql-0..."
              until mysql -h mysql-{{ $i }}.mysql-headless -u root -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" > /dev/null 2>&1; do
                sleep 3
              done

              mysql -h mysql-{{ $i }}.mysql-headless -u root -p"${MYSQL_ROOT_PASSWORD}" <<EOF
              STOP REPLICA;
              CHANGE REPLICATION SOURCE TO
                SOURCE_HOST='mysql-0.mysql-headless.{{ $.Release.Namespace }}.svc.cluster.local',
                SOURCE_PORT=3306,
                SOURCE_USER='${REPL_USER}',
                SOURCE_PASSWORD='${REPL_PASSWORD}',
                SOURCE_AUTO_POSITION=1;
              START REPLICA;
              EOF
              echo "Replica mysql-{{ $i }} connected to mysql-0."
              {{- end }}
              {{- end }}
{{- end }}
